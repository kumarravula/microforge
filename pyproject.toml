[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microforge"
version = "0.1.0"
description = "Sub-8 MB Edge Foundation Model with BitNet b1.58 Ternary Quantization for On-Device Tool Calling and Structured Extraction"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "bitnet",
    "edge-ai",
    "on-device-ai",
    "quantization",
    "function-calling",
    "tool-use",
    "tinyml",
    "cactus-needle",
    "slm",
    "droidcall",
]
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "pyyaml>=6.0",
    "numpy>=1.20.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/kumarravula/microforge"
Repository = "https://github.com/kumarravula/microforge"
"Bug Tracker" = "https://github.com/kumarravula/microforge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["microforge*"]
