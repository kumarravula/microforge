[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microforge"
version = "0.1.0"
description = "Sub-15 MB Edge Foundation Model for Tool-Calling and Structured Extraction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "pyyaml>=6.0",
    "numpy>=1.20.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["microforge*"]
