<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="700" height="400" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">MicroForge Architecture</text>
  <text x="350" y="52" text-anchor="middle" fill="#8b949e" font-size="10">12-Layer BitNet b1.58 Transformer with Dual-Head Routing</text>

  <!-- Pipeline flow -->
  <!-- Input -->
  <rect x="30" y="80" width="120" height="50" fill="#1f2937" stroke="#374151" stroke-width="1.5" rx="8"/>
  <text x="90" y="100" text-anchor="middle" fill="#e5e7eb" font-size="11" font-weight="600">User Query</text>
  <text x="90" y="116" text-anchor="middle" fill="#9ca3af" font-size="9">"Set an alarm..."</text>

  <!-- Arrow -->
  <line x1="150" y1="105" x2="175" y2="105" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6b7280"/></marker></defs>

  <!-- Tokenizer -->
  <rect x="180" y="80" width="110" height="50" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" rx="8"/>
  <text x="235" y="100" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">BPE Tokenizer</text>
  <text x="235" y="116" text-anchor="middle" fill="#818cf8" font-size="9">4,096 vocab</text>

  <!-- Arrow -->
  <line x1="290" y1="105" x2="315" y2="105" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Factorized Embedding -->
  <rect x="320" y="80" width="120" height="50" fill="#14532d" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="380" y="98" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="600">Factorized</text>
  <text x="380" y="112" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="600">Embedding</text>
  <text x="380" y="124" text-anchor="middle" fill="#4ade80" font-size="8">V×128 → 128×512</text>

  <!-- Arrow down -->
  <line x1="380" y1="130" x2="380" y2="155" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transformer Block -->
  <rect x="260" y="160" width="240" height="120" fill="#1c1917" stroke="#f97316" stroke-width="2" rx="10"/>
  <text x="380" y="180" text-anchor="middle" fill="#f97316" font-size="12" font-weight="700">× 12 Transformer Blocks</text>

  <!-- Sub-components inside -->
  <rect x="275" y="192" width="100" height="28" fill="#292524" stroke="#78716c" stroke-width="1" rx="5"/>
  <text x="325" y="210" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">RMSNorm + GQA</text>

  <rect x="385" y="192" width="100" height="28" fill="#292524" stroke="#78716c" stroke-width="1" rx="5"/>
  <text x="435" y="210" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">RoPE Attention</text>

  <rect x="275" y="228" width="100" height="28" fill="#292524" stroke="#78716c" stroke-width="1" rx="5"/>
  <text x="325" y="246" text-anchor="middle" fill="#34d399" font-size="9" font-weight="600">BitNet Linear</text>

  <rect x="385" y="228" width="100" height="28" fill="#292524" stroke="#78716c" stroke-width="1" rx="5"/>
  <text x="435" y="246" text-anchor="middle" fill="#fb923c" font-size="9" font-weight="600">SwiGLU FFN</text>

  <!-- Sub label -->
  <text x="380" y="270" text-anchor="middle" fill="#78716c" font-size="8">8 query heads • 2 KV heads • 1536 FFN dim</text>

  <!-- Arrow down from transformer -->
  <line x1="380" y1="280" x2="380" y2="305" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Split into 3 heads -->
  <!-- Tool Router Head -->
  <rect x="50" y="310" width="160" height="55" fill="#312e81" stroke="#6366f1" stroke-width="1.5" rx="8"/>
  <text x="130" y="332" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="700">🎯 Tool Router</text>
  <text x="130" y="348" text-anchor="middle" fill="#818cf8" font-size="9">24-class classifier</text>
  <text x="130" y="360" text-anchor="middle" fill="#6366f1" font-size="8">→ ACTION_SET_ALARM</text>

  <!-- LM Generator Head -->
  <rect x="270" y="310" width="160" height="55" fill="#7c2d12" stroke="#f97316" stroke-width="1.5" rx="8"/>
  <text x="350" y="332" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="700">📝 LM Generator</text>
  <text x="350" y="348" text-anchor="middle" fill="#fdba74" font-size="9">FSM Grammar Masked</text>
  <text x="350" y="360" text-anchor="middle" fill="#f97316" font-size="8">→ {"hour": 7, "min": 30}</text>

  <!-- Confidence Head -->
  <rect x="490" y="310" width="160" height="55" fill="#14532d" stroke="#22c55e" stroke-width="1.5" rx="8"/>
  <text x="570" y="332" text-anchor="middle" fill="#bbf7d0" font-size="11" font-weight="700">📊 Confidence</text>
  <text x="570" y="348" text-anchor="middle" fill="#4ade80" font-size="9">Calibrated sigmoid</text>
  <text x="570" y="360" text-anchor="middle" fill="#22c55e" font-size="8">→ 0.97 (ECE &lt; 0.05)</text>

  <!-- Connecting lines from transformer to heads -->
  <line x1="320" y1="305" x2="130" y2="310" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <line x1="380" y1="305" x2="350" y2="310" stroke="#f97316" stroke-width="1" opacity="0.6"/>
  <line x1="440" y1="305" x2="570" y2="310" stroke="#22c55e" stroke-width="1" opacity="0.6"/>

  <!-- Quantization badge -->
  <rect x="510" y="80" width="150" height="50" fill="#1a1a2e" stroke="#f97316" stroke-width="1" rx="25" stroke-dasharray="4,2"/>
  <text x="585" y="100" text-anchor="middle" fill="#f97316" font-size="10" font-weight="700">⚡ BitNet b1.58</text>
  <text x="585" y="115" text-anchor="middle" fill="#fdba74" font-size="9">{-1, 0, +1} weights</text>
  <text x="585" y="126" text-anchor="middle" fill="#8b949e" font-size="8">Zero FP multiplications</text>

  <!-- Footer -->
  <text x="350" y="392" text-anchor="middle" fill="#484f58" font-size="9">37M parameters • 7.19 MB packed binary • Pure integer inference on ARM/x86 edge CPUs</text>
</svg>
