<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c38"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="forge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="tech-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="24" cy="24" r="1" fill="#30363d" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="200" rx="10" fill="url(#bg-grad)"/>
  <rect width="800" height="200" rx="10" fill="url(#tech-grid)"/>

  <!-- Ambient Glow -->
  <circle cx="95" cy="100" r="85" fill="#f97316" fill-opacity="0.08" filter="url(#forge-glow)"/>

  <!-- Circuit Traces -->
  <g stroke="#388bfd" stroke-opacity="0.18" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 40 L 40 40 L 60 60 L 60 90"/>
    <path d="M 0 160 L 50 160 L 70 140 L 70 115"/>
    <path d="M 140 30 L 160 50 L 220 50"/>
    <path d="M 130 170 L 155 145 L 200 145"/>
    <path d="M 760 30 L 720 70 L 650 70"/>
    <path d="M 800 150 L 740 150 L 710 120 L 670 120"/>
    <circle cx="220" cy="50" r="2.5" fill="#388bfd" fill-opacity="0.3"/>
    <circle cx="200" cy="145" r="2.5" fill="#388bfd" fill-opacity="0.3"/>
    <circle cx="650" cy="70" r="2.5" fill="#388bfd" fill-opacity="0.3"/>
    <circle cx="670" cy="120" r="2.5" fill="#388bfd" fill-opacity="0.3"/>
  </g>

  <!-- Anvil + Lightning Icon -->
  <g transform="translate(15, 0)">
    <path d="M 45 74 C 50 74, 58 72, 65 68 L 142 68 C 145 68, 147 70, 147 73 L 147 80 C 147 83, 144 85, 141 86 L 126 89 C 118 92, 114 98, 114 106 L 114 112 C 114 118, 120 123, 126 126 L 138 132 C 141 133, 143 136, 143 139 L 143 144 C 143 147, 141 149, 138 149 L 48 149 C 45 149, 43 147, 43 144 L 43 139 C 43 136, 45 133, 48 132 L 60 126 C 66 123, 72 118, 72 112 L 72 106 C 72 98, 68 92, 60 89 L 38 83 C 33 81, 33 76, 38 74 Z" fill="#1c2128" stroke="url(#orange-grad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 68 73 L 138 73" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <polygon points="98,46 76,96 93,96 82,142 112,88 95,88 106,46" fill="url(#orange-grad)" filter="url(#forge-glow)"/>
    <polygon points="98,46 76,96 93,96 82,142 112,88 95,88 106,46" fill="#fff" opacity="0.3"/>
    <circle cx="120" cy="56" r="2" fill="#ffb703"/>
    <circle cx="65" cy="58" r="1.5" fill="#ff6b35"/>
    <circle cx="132" cy="78" r="1.5" fill="#ffb703"/>
    <circle cx="58" cy="100" r="1.8" fill="#f97316"/>
  </g>

  <!-- Title -->
  <text x="180" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5px" fill="#ffffff">MicroForge</text>
  <text x="182" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" letter-spacing="0.3px" fill="#8b949e">Sub-8 MB Edge Foundation Model</text>

  <!-- Feature Pills -->
  <g transform="translate(182, 142)">
    <rect x="0" y="0" width="100" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="11" cy="11" r="3.5" fill="#ff6b35"/>
    <text x="20" y="15" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#c9d1d9">1.58-Bit Ternary</text>

    <rect x="108" y="0" width="110" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="119" cy="11" r="3.5" fill="#58a6ff"/>
    <text x="128" y="15" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#c9d1d9">FSM Grammar Mask</text>

    <rect x="226" y="0" width="100" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="237" cy="11" r="3.5" fill="#3fb950"/>
    <text x="246" y="15" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#c9d1d9">Zero FP Multiply</text>

    <rect x="334" y="0" width="90" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="345" cy="11" r="3.5" fill="#f97316"/>
    <text x="354" y="15" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#c9d1d9">7.19 MB Binary</text>
  </g>

  <rect x="0.5" y="0.5" width="799" height="199" rx="10" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.8"/>
</svg>
